<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>{% block title %}WPA-L Archive Reader{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='reader.css') }}">
</head>
<body>
<div class="draft-banner" role="note">Working draft. Page text is placeholder.</div>
<header class="site">
  <a class="brand" href="{{ url_for('home') }}">WPA-L Archive Reader</a>
  <nav aria-label="Main">
    <a href="{{ url_for('home') }}">Browse</a>
    <a href="{{ url_for('search') }}">Search</a>
    <a href="{{ url_for('timeline') }}">Timeline</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('opt_out') }}">Opt out</a>
  </nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer class="site">
  Source: the WPA-L archive, 1993–2021, deposited on the Internet Archive under a public-domain mark.
  Email addresses are removed. <a href="{{ url_for('opt_out') }}">Ask to have your messages withdrawn</a>.
</footer>
</body>
</html>
